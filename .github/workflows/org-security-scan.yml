name: Weekly Org-Wide Security Scan

# Centralized weekly security scan for all iokdigital/* repositories.
#
# Uses the GitHub Contents API to download dependency manifests (package.json,
# requirements.txt, go.mod) instead of full git clones. This works with
# the default GITHUB_TOKEN (which can read other org repos via API) but
# cannot git clone them.

on:
  schedule:
    - cron: '0 9 * * 0'    # Sundays 9 AM UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  security-events: write
  actions: read

concurrency:
  group: org-security-scan
  cancel-in-progress: true

jobs:
  scan:
    name: Weekly Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Fetch dependency manifests via Contents API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/manifests
          cd /tmp/manifests

          # (repo, default_branch) tuples
          REPOS=(
            "iokdigital/alteryx2airflow:main"
            "iokdigital/alteryx2talend:develop"
            "iokdigital/flowport-webapp:develop"
            "iokdigital/flowport2jira:develop"
            "iokdigital/go-mermaid:main"
            "iokdigital/iok.digital:main"
            "iokdigital/talend2airflow:main"
          )

          fetch_file() {
            local path="$1" dest_dir="$2"
            mkdir -p "$dest_dir"
            curl -sfL \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/${repo}/contents/${path}?ref=${branch}" \
              -o "${dest_dir}/${path##*/}" 2>/dev/null && echo "  OK: $path" || echo "  MISSING: $path"
          }

          for entry in "${REPOS[@]}"; do
            IFS=':' read -r repo branch <<< "$entry"
            safe_name=$(echo "$repo" | tr '/' '-')
            echo "=== Fetching manifests from $repo @ $branch ==="
            case "$repo" in
              # Go repos
              iokdigital/alteryx2airflow|iokdigital/alteryx2talend|iokdigital/go-mermaid|iokdigital/talend2airflow)
                fetch_file "go.mod" "$safe_name"
                fetch_file "go.sum" "$safe_name"
                fetch_file "worker/go.mod" "$safe_name" 2>/dev/null || true
                fetch_file "worker/requirements.txt" "$safe_name" 2>/dev/null || true
                ;;
              # Python repos
              iokdigital/flowport2jira|iokdigital/talend2airflow|iokdigital/alteryx2airflow)
                fetch_file "requirements.txt" "$safe_name" 2>/dev/null || true
                fetch_file "worker/requirements.txt" "$safe_name" 2>/dev/null || true
                ;;
              # Node repos
              iokdigital/flowport-webapp|iokdigital/iok.digital)
                fetch_file "frontend/package.json" "$safe_name" 2>/dev/null || true
                fetch_file "frontend/package-lock.json" "$safe_name" 2>/dev/null || true
                fetch_file "backend/requirements.txt" "$safe_name" 2>/dev/null || true
                fetch_file "backend/pyproject.toml" "$safe_name" 2>/dev/null || true
                fetch_file "package.json" "$safe_name" 2>/dev/null || true
                fetch_file "package-lock.json" "$safe_name" 2>/dev/null || true
                ;;
            esac
          done
          echo ""
          echo "=== Fetched manifests ==="
          find /tmp/manifests -type f | sort

      - name: Checkout summarization scripts
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Setup tools
        run: |
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash - >/dev/null 2>&1
          apt-get install -y nodejs >/dev/null 2>&1 || true
          node --version
          python3 -m pip install --quiet --user pip-audit 2>&1 | tail -2 || true
          curl -sfL https://raw.githubusercontent.com/google/osv-scanner/main/scripts/install.sh | bash -s -- -b ./bin 2>&1 | tail -3 || true

      - name: Scan Go modules with OSV-Scanner
        run: |
          mkdir -p /tmp/results/go
          for repo_dir in /tmp/manifests/iokdigital-*; do
            [ -f "${repo_dir}/go.mod" ] || continue
            repo=$(basename "$repo_dir")
            echo "=== OSV: $repo ==="
            ./bin/osv-scanner -r "${repo_dir}" --format json \
              > "/tmp/results/go/${repo}_osv.json" 2> "/tmp/results/go/${repo}_stderr.txt" || true
            python3 "${GITHUB_WORKSPACE}/.github/scripts/summarize-osv.py" "/tmp/results/go/${repo}_osv.json" || true
          done
        continue-on-error: true

      - name: Scan Python requirements with pip-audit
        run: |
          mkdir -p /tmp/results/python
          export PATH="${HOME}/.local/bin:${PATH}"
          pip-audit --version 2>&1 || echo "pip-audit not available"
          for repo_dir in /tmp/manifests/iokdigital-*; do
            [ -f "${repo_dir}/requirements.txt" ] || continue
            repo=$(basename "$repo_dir")
            echo "=== pip-audit: $repo ==="
            (cd "$repo_dir" && pip-audit -r requirements.txt --disable-pip 2>&1) \
              > "/tmp/results/python/${repo}_stdout.txt" || true
            if [ -f "${repo_dir}/pyproject.toml" ]; then
              echo "  (also scanning pyproject.toml)"
              (cd "$repo_dir" && pip-audit --disable-pip 2>&1) \
                >> "/tmp/results/python/${repo}_stdout.txt" || true
            fi
          done
        continue-on-error: true

      - name: Scan Node packages with npm audit
        run: |
          mkdir -p /tmp/results/node
          for repo_dir in /tmp/manifests/iokdigital-*; do
            [ -f "${repo_dir}/package.json" ] || continue
            [ -f "${repo_dir}/package-lock.json" ] || continue
            repo=$(basename "$repo_dir")
            echo "=== npm audit: $repo ==="
            cd "$repo_dir"
            if [ ! -d node_modules ]; then
              npm install --silent --no-audit --no-fund --ignore-scripts 2>/dev/null || true
            fi
            npm audit --json 2>/dev/null > "/tmp/results/node/${repo}_audit.json" || true
            python3 "${GITHUB_WORKSPACE}/.github/scripts/summarize-npm-audit.py" "/tmp/results/node/${repo}_audit.json" || true
          done
        continue-on-error: true

      - name: Build weekly report
        run: |
          {
            echo "# Weekly iokdigital Security Scan"
            echo ""
            echo "**Generated**: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "**Repos scanned**: 7"
            echo ""
            echo "## Summary"
            echo ""
            echo "| Ecosystem | Files | Notes |"
            echo "|---|---|---|"
            for eco in go python node; do
              count=$(find /tmp/results/$eco -type f 2>/dev/null | wc -l | tr -d ' ')
              echo "| $eco | $count | see below |"
            done
            echo ""
            echo "## Results"
            echo ""
            for eco in go python node; do
              echo "### $eco"
              echo ""
              if [ -d /tmp/results/$eco ]; then
                for f in /tmp/results/$eco/*; do
                  [ -f "$f" ] || continue
                  echo "--- $(basename $f) ---"
                  if [[ "$f" == *.json ]]; then
                    python3 "${GITHUB_WORKSPACE}/.github/scripts/$(echo summarize-osv.py)" "$f" 2>/dev/null || head -20 "$f"
                  else
                    head -20 "$f"
                  fi
                  echo ""
                done
              fi
            done
            echo "## Detailed results"
            echo ""
            echo "All raw outputs uploaded as workflow artifacts."
          } > /tmp/weekly-report.md
          echo "report size: $(wc -l < /tmp/weekly-report.md) lines"

      - name: Upload report artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: weekly-report
          path: /tmp/weekly-report.md
          retention-days: 90
          if-no-files-found: warn

      - name: Create or update weekly issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/weekly-report.md', 'utf8');
            const date = new Date().toISOString().split('T')[0];

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'weekly-org-security-scan'
            });

            const title = 'Weekly iokdigital Security Scan - ' + date;
            const body = report;

            if (issues.data.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body,
                state: 'open'
              });
              core.info('Updated issue #' + issues.data[0].number);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['weekly-org-security-scan', 'security']
              });
            }
