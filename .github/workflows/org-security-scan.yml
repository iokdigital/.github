name: Weekly Org-Wide Security Scan

# Centralized weekly security scan for all iokdigital/* repositories.
#
# Uses the GitHub Contents API to download dependency manifests (package.json,
# requirements.txt, go.mod) instead of full git clones. The default GITHUB_TOKEN
# can read other org repos via the API but cannot git clone them.
#
# Replaces 5 per-repo security.yml weekly cron jobs:
# - alteryx2airflow: main
# - alteryx2talend: develop
# - flowport-webapp: develop
# - flowport2jira: develop
# - talend2airflow: main

on:
  schedule:
    - cron: '0 9 * * 0'    # Sundays 9 AM UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  security-events: write
  actions: read

concurrency:
  group: org-security-scan
  cancel-in-progress: true

jobs:
  scan:
    name: Weekly Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout summarization scripts (before fetch so they exist)
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Fetch dependency manifests via Git Trees API
        env:
          # Uses CROSS_REPO_READ_TOKEN (PAT with cross-repo read) if set,
          # otherwise falls back to default GITHUB_TOKEN (only works for public repos)
          GH_TOKEN: ${{ secrets.CROSS_REPO_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/manifests
          python3 "$GITHUB_WORKSPACE/.github/scripts/fetch-manifests.py"
          echo ''
          echo '=== Total files fetched ==='
          find /tmp/manifests -type f | wc -l

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup Python + install pip-audit
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install pip-audit
        run: |
          python -m pip install --user pip-audit
          export PATH="$HOME/.local/bin:$PATH"
          pip-audit --version

      - name: Install OSV-Scanner
        run: |
          mkdir -p ./bin
          curl -fsSL https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_linux_amd64 -o ./bin/osv-scanner
          chmod +x ./bin/osv-scanner
          ./bin/osv-scanner --version

      - name: Scan Go modules with OSV-Scanner
        run: |
          mkdir -p /tmp/results/go
          scanned=0
          for repo_dir in /tmp/manifests/iokdigital-*; do
            [ -f "${repo_dir}/go.mod" ] || continue
            repo=$(basename "$repo_dir")
            if [ ! -x ./bin/osv-scanner ]; then
              echo "=== ${repo}: SKIPPED (osv-scanner not installed) ==="
              continue
            fi
            echo "=== OSV: $repo ==="
            if ./bin/osv-scanner -r "${repo_dir}" --format json \
                > "/tmp/results/go/${repo}_osv.json" 2> "/tmp/results/go/${repo}_stderr.txt"; then
              python3 "${GITHUB_WORKSPACE}/.github/scripts/summarize-osv.py" "/tmp/results/go/${repo}_osv.json" || true
              scanned=$((scanned + 1))
            else
              echo "  (scan failed - see ${repo}_stderr.txt)"
            fi
          done
          echo ""
          echo "=== Total Go repos scanned: $scanned ==="
        continue-on-error: true

      - name: Scan Python requirements with pip-audit
        run: |
          mkdir -p /tmp/results/python
          scanned=0
          for repo_dir in /tmp/manifests/iokdigital-*; do
            [ -f "${repo_dir}/requirements.txt" ] || continue
            repo=$(basename "$repo_dir")
            echo "=== pip-audit: $repo ==="
            if (cd "$repo_dir" && python3 -m pip_audit -r requirements.txt --disable-pip --strict 2>&1) \
                > "/tmp/results/python/${repo}_stdout.txt"; then
              scanned=$((scanned + 1))
              echo "  OK"
            else
              echo "  (vulnerabilities found or audit failed - see ${repo}_stdout.txt)"
            fi
          done
          echo ""
          echo "=== Total Python repos scanned: $scanned ==="
        continue-on-error: true

      - name: Scan Node packages with npm audit
        run: |
          mkdir -p /tmp/results/node
          scanned=0
          for repo_dir in /tmp/manifests/iokdigital-*; do
            [ -f "${repo_dir}/package.json" ] || continue
            [ -f "${repo_dir}/package-lock.json" ] || continue
            repo=$(basename "$repo_dir")
            echo "=== npm audit: $repo ==="
            cd "$repo_dir"
            if [ ! -d node_modules ]; then
              echo "  (running npm install...)"
              npm install --silent --no-audit --no-fund --ignore-scripts 2>&1 | tail -2 || echo "  (npm install failed - may have vulns anyway)"
            fi
            if npm audit --json 2>/dev/null > "/tmp/results/node/${repo}_audit.json"; then
              python3 "${GITHUB_WORKSPACE}/.github/scripts/summarize-npm-audit.py" "/tmp/results/node/${repo}_audit.json" || true
              scanned=$((scanned + 1))
            else
              echo "  (npm audit failed)"
            fi
          done
          echo ""
          echo "=== Total Node repos scanned: $scanned ==="
        continue-on-error: true

      - name: Build weekly report
        run: |
          {
            echo "# Weekly iokdigital Security Scan"
            echo ""
            echo "**Generated**: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "**Repos scanned**: 7"
            echo ""
            echo "## Summary"
            echo ""
            echo "| Ecosystem | Files scanned | Notes |"
            echo "|---|---|---|"
            for eco in go python node; do
              count=$(find /tmp/results/$eco -type f -size +0 2>/dev/null | wc -l | tr -d ' ')
              echo "| $eco | $count | $(find /tmp/manifests -maxdepth 1 -type d -name "iokdigital-*" | wc -l | tr -d ' ') repos |"
            done
            echo ""
            echo "## Detailed results"
            echo ""
            for eco in go python node; do
              echo "### $eco"
              echo ""
              if [ -d /tmp/results/$eco ] && [ "$(ls -A /tmp/results/$eco 2>/dev/null)" ]; then
                for f in /tmp/results/$eco/*; do
                  [ -f "$f" ] || continue
                  echo "--- $(basename $f) ---"
                  if [[ "$f" == *.json ]]; then
                    python3 "${GITHUB_WORKSPACE}/.github/scripts/summarize-osv.py" "$f" 2>/dev/null || head -30 "$f"
                  else
                    head -30 "$f"
                  fi
                  echo ""
                done
              else
                echo "(no results)"
              fi
            done
            echo ""
            echo "## Artifacts"
            echo ""
            echo "Raw scanner outputs uploaded as workflow artifacts (retention 90 days)."
          } > /tmp/weekly-report.md
          echo "report size: $(wc -l < /tmp/weekly-report.md) lines"

      - name: Upload report artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: weekly-report
          path: /tmp/weekly-report.md
          retention-days: 90
          if-no-files-found: warn

      - name: Create or update weekly issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/weekly-report.md', 'utf8');
            const date = new Date().toISOString().split('T')[0];

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'weekly-org-security-scan'
            });

            const title = 'Weekly iokdigital Security Scan - ' + date;
            const body = report;

            if (issues.data.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body,
                state: 'open'
              });
              core.info('Updated issue #' + issues.data[0].number);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['weekly-org-security-scan', 'security']
              });
            }
