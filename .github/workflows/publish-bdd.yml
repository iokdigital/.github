name: Publish BDD to Confluence

# Centralized reusable workflow. Consumer repos call this with:
#   uses: iokdigital/.github/.github/workflows/publish-bdd.yml@c25cfa12f2e84bcf0804e3174ab031c97887a3f4  # main
#   with:
#     component: <repo-name>
#   secrets: inherit
# Consumers keep their own trigger (push to develop on docs/BDD/*.feature)
# and workflow_dispatch.

on:
  workflow_call:
    inputs:
      component:
        description: 'Component name (repo name) published to Confluence'
        required: true
        type: string
    secrets:
      INFISICAL_CLIENT_ID:
        required: true
      INFISICAL_CLIENT_SECRET:
        required: true
      INFISICAL_PROJECT_ID:
        required: true

permissions:
  contents: read

jobs:
  publish-bdd:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout caller code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ github.repository }}
        ref: ${{ github.ref }}

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: pip install requests

    - name: Fetch Confluence Secrets from Infisical
      uses: iokdigital/.github/.github/actions/infisical-secrets@29779132f45999c0e9bc188258eed2419b047a41
      with:
        client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
        client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        project-id: ${{ secrets.INFISICAL_PROJECT_ID }}
        secret-keys: "ATLASSIAN_CONFLUENCE_TOKEN,ATLASSIAN_CONFLUENCE_EMAIL"

    - name: Publish BDD to Confluence
      env:
        CONFLUENCE_BASE_URL: https://iokdigital.atlassian.net/wiki
        SPACE_KEY: PORT
        COMPONENT: ${{ inputs.component }}
      run: python scripts/publish_bdd.py
