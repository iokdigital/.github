name: CD - Dev Tracking

# Centralized reusable workflow. Consumer repos call this with:
#   uses: iokdigital/.github/.github/workflows/cd-dev-tracking.yml@<sha>
#   with:
#     image_name: alteryx2fabric-worker
#     version_var: fabric_version
#   secrets: inherit
# Publishes develop images for dev.flowport.co.uk tracking and triggers a
# worker-only dev deploy. Prod is untouched (prod consumes v* releases).

on:
  workflow_call:
    inputs:
      image_name:
        description: "Docker image name (e.g., alteryx2fabric-worker)"
        required: true
        type: string
      version_var:
        description: "Deploy spec variable name (e.g., fabric_version)"
        required: true
        type: string
    secrets:
      DIGITALOCEAN_ACCESS_TOKEN:
        required: true
      CROSS_REPO_READ_TOKEN:
        required: false
      GH_TOKEN:
        description: "GitHub token for triggering flowport-webapp deploy"
        required: false

permissions:
  contents: read

env:
  REGISTRY: registry.digitalocean.com/flowport-registry

jobs:
  build-and-trigger-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4

      - name: Install doctl
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f  # v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Login to Container Registry
        run: doctl registry login

      - name: Read VERSION
        id: version
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push develop images
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          file: ./Dockerfile.worker
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ inputs.image_name }}:develop-latest
            ${{ env.REGISTRY }}/${{ inputs.image_name }}:develop-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CROSS_REPO_READ_TOKEN=${{ secrets.CROSS_REPO_READ_TOKEN }}
            VERSION=${{ steps.version.outputs.version }}

      - name: Trigger dev deploy (worker-only)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.CROSS_REPO_READ_TOKEN }}
        run: |
          gh workflow run cd-dev.yml \
            --repo iokdigital/flowport-webapp \
            -f workers_only=true \
            -f ${{ inputs.version_var }}=develop-${{ github.sha }}
