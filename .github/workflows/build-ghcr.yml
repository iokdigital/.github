name: Build ghcr.io

# Centralized reusable workflow. Consumer repos call this with:
#   uses: iokdigital/.github/.github/workflows/build-ghcr.yml@<sha>
#   secrets: inherit
# Builds the worker image (no push - ghcr images are write-only; DOCR is
# the deploy registry). Retention handled by cleanup-ghcr.yml.

on:
  workflow_call:

permissions:
  contents: read
  packages: read

jobs:
  build-ghcr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4

      - name: Read VERSION
        id: version
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Build worker image (no push - ghcr images are write-only; DOCR is the deploy registry)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: ./Dockerfile.worker
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CROSS_REPO_READ_TOKEN=${{ secrets.CROSS_REPO_READ_TOKEN }}
            VERSION=${{ steps.version.outputs.version }}
